<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Search App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
       <!-- Header Section -->
    <header>
        <h1>🍳 Recipe Finder</h1>
        <p>Discover delicious recipes from around the world</p>
            <button onclick="showSavedRecipes()" class="saved-recipes-btn">❤️ View My Saved Recipes</button>
    </header>

    <!-- Search Section -->
    <section class="search-section">
        <div class="search-box">
            <h3>Search by Recipe Name</h3>
            <input type="text" id="searchInput" placeholder="e.g., Chicken Curry, Pasta, Cake...">
            <button onclick="searchRecipe()">Search Recipes</button>
                        <button class="cat-btn nigerian-btn" onclick="showNigerianRecipes()">🇳🇬 Nigerian Recipes</button>
        </div>
        
        <div class="search-box">
            <h3>Search by Ingredient</h3>
            <input type="text" id="ingredientInput" placeholder="e.g., Chicken, Egg, Tomato...">
            <button onclick="searchByIngredient()">Find Recipes</button>
        </div>
    </section>

        <!-- Category Section -->
    <section class="category-section">
        <h2>Browse by Category</h2>
        <div class="category-buttons">
            <button class="cat-btn" onclick="searchCategory('Beef')">🥩 Beef</button>
            <button class="cat-btn" onclick="searchCategory('Chicken')">🍗 Chicken</button>
            <button class="cat-btn" onclick="searchCategory('Dessert')">🍰 Dessert</button>
            <button class="cat-btn" onclick="searchCategory('Lamb')">🍖 Lamb</button>
            <button class="cat-btn" onclick="searchCategory('Pasta')">🍝 Pasta</button>
            <button class="cat-btn" onclick="searchCategory('Pork')">🥓 Pork</button>
            <button class="cat-btn" onclick="searchCategory('Seafood')">🦐 Seafood</button>
            <button class="cat-btn" onclick="searchCategory('Side')">🥗 Side Dish</button>
            <button class="cat-btn" onclick="searchCategory('Starter')">🥘 Starter</button>
            <button class="cat-btn" onclick="searchCategory('Vegetarian')">🥦 Vegetarian</button>
            <button class="cat-btn" onclick="searchCategory('Breakfast')">🍳 Breakfast</button>
            <button class="cat-btn" onclick="searchCategory('Vegan')">🌱 Vegan</button>
                        <button class="cat-btn random-btn" onclick="showRandomRecipe()">🎲 Surprise Me!</button>
        </div>
    </section>

    <!-- Results Section -->
    <section id="results">
        <!-- Recipes will show here -->
    </section>
    
    <script src="app.js"></script>
</body>
</html>
